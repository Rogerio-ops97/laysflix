<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080b18">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LaysFlix">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
  <title>LaysFlix</title>
</head>
<body>
  <header><div class="brand"><img src="icons/icon-192.png" alt=""><div><b>LaysFlix</b><small>minha biblioteca</small></div></div><button id="settingsButton" class="round" aria-label="Ajustes">⚙</button></header>
  <main>
    <section class="hero"><p>Seu cinema, do seu jeito.</p><h1>O que vamos assistir hoje?</h1><form id="searchForm"><input id="searchInput" type="search" placeholder="Buscar filmes e séries" autocomplete="off"><button>Buscar</button></form></section>
    <section class="stats" aria-label="Resumo"><article><b id="totalCount">0</b><span>na biblioteca</span></article><article><b id="watchingCount">0</b><span>assistindo</span></article><article><b id="watchedCount">0</b><span>assistidos</span></article></section>
    <section><div class="section-title"><h2 id="sectionTitle">Minha biblioteca</h2><select id="filter"><option value="all">Tudo</option><option value="watching">Assistindo</option><option value="watchlist">Quero assistir</option><option value="watched">Assistidos</option><option value="favorite">Favoritos</option></select></div><div id="message" class="message"></div><div id="grid" class="grid"></div></section>
  </main>
  <dialog id="details"><button class="close" aria-label="Fechar">×</button><div id="detailsContent"></div></dialog>
  <dialog id="settings"><button class="close" aria-label="Fechar">×</button><h2>Ajustes</h2><label>Chave da API ou token do TMDB<input id="tmdbKey" type="password" autocomplete="off" placeholder="Cole aqui"></label><p class="hint">Fica somente neste aparelho. Nunca é enviada ao GitHub.</p><button id="saveKey" class="primary">Salvar chave</button><hr><button id="exportData">Exportar backup</button><label class="file">Importar backup<input id="importData" type="file" accept="application/json"></label></dialog>
  <div id="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
