<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#070810">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LaysFlix">
  <link rel="manifest" href="manifest.webmanifest?v=9">
  <link rel="preconnect" href="https://image.tmdb.org" crossorigin>
  <link rel="preload" as="image" href="__INTRO_PRELOAD__" fetchpriority="high">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css?v=9">
  <link rel="stylesheet" href="premium.css?v=9">
  <title>LaysFlix</title>
</head>
<body>
  <div id="intro" class="intro" aria-label="LaysFlix carregando">
    <div id="introBackdrop" class="intro-backdrop" style="background-image:url('__INTRO_PRELOAD__')"></div><div class="intro-aurora"></div><div class="intro-shade"></div><div class="intro-grain"></div>
    <button id="skipIntro">Pular</button>
    <div class="intro-brand"><img src="icons/icon-512.png" alt=""><h1>LaysFlix</h1><p>Seu cinema. Sua história.</p></div>
    <div id="introMovie" class="intro-movie"></div><div class="intro-progress"><i></i></div>
  </div>
  <div id="app">
    <header class="topbar"><button id="brandButton" class="brand"><img src="icons/icon-192.png" alt=""><span>LaysFlix</span></button><div class="top-actions"><button id="searchButton" class="icon-button" aria-label="Buscar">⌕</button><button id="settingsButton" class="avatar" aria-label="Perfil e ajustes">L</button></div></header>
    <main id="main"></main>
    <nav class="tabbar" aria-label="Navegação principal">
      <button data-view="home" class="active"><span>⌂</span><small>Início</small></button>
      <button data-view="discover"><span>⌕</span><small>Descobrir</small></button>
      <button data-view="library"><span>▦</span><small>Biblioteca</small></button>
      <button data-view="profile"><span>◉</span><small>Dashboard</small></button>
    </nav>
  </div>
  <section id="detailPage" class="page-layer" aria-hidden="true"><div id="detailContent"></div></section>
  <section id="searchPage" class="page-layer" aria-hidden="true"><div class="page-head"><button class="back" data-close-search>‹</button><form id="searchForm"><input id="searchInput" type="search" placeholder="Filmes, séries e pessoas" autocomplete="off"><button>Buscar</button></form></div><div id="searchResults" class="search-results"></div></section>
  <dialog id="settings"><button class="close" aria-label="Fechar">×</button><div class="settings-brand"><img src="icons/icon-192.png" alt=""><div><h2>LaysFlix</h2><p>Seu cinema, do seu jeito.</p></div></div><label>Token de leitura ou chave do TMDB<input id="tmdbKey" type="password" autocomplete="off" placeholder="Cole aqui"></label><p class="hint">Guardado somente neste iPhone.</p><button id="saveKey" class="primary full">Salvar acesso</button><section class="settings-section"><h3>Listas personalizadas</h3><div id="customLists"></div><div class="inline-form"><input id="newListName" maxlength="32" placeholder="Nome da nova lista"><button id="createList">Criar</button></div></section><section class="settings-section"><h3>Seus dados</h3><p id="backupStatus" class="hint"></p><div class="setting-actions"><button id="exportData">Exportar backup</button><label class="file">Importar backup<input id="importData" type="file" accept="application/json"></label><button id="restoreTrash">Lixeira</button><button id="clearCache">Limpar cache</button></div></section><p class="tmdb-credit">Este produto usa a API do TMDB, mas não é endossado nem certificado pelo TMDB. Disponibilidade de streaming por JustWatch.</p></dialog>
  <div id="toast" role="status"></div>
  <script src="config.js?build=__BUILD_ID__"></script>
  <script src="app-v8.js?v=9"></script>
</body>
</html>
