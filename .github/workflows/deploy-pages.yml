name: Publicar LaysFlix no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v6
      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Preparar acesso ao TMDB
        env:
          TMDB_TOKEN: ${{ secrets.TOKEN_TMDB || secrets.TMDB_TOKEN }}
          BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if [ -z "$TMDB_TOKEN" ]; then
            echo "::error::Crie o secret TOKEN_TMDB em Settings > Secrets and variables > Actions."
            exit 1
          fi
          node -e "const fs=require('fs'); fs.writeFileSync('config.js', 'window.LAYSFLIX_TMDB_TOKEN = ' + JSON.stringify(process.env.TMDB_TOKEN) + ';\n')"
          node -e "const fs=require('fs'); const p='index.html'; fs.writeFileSync(p, fs.readFileSync(p,'utf8').replace('__BUILD_ID__', process.env.BUILD_ID))"
          node -e "const fs=require('fs'); fs.appendFileSync('config.js', 'window.LAYSFLIX_BUILD_ID = ' + JSON.stringify(process.env.BUILD_ID) + ';\n')"
          node scripts/resolve-history.mjs
      - name: Preparar site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
